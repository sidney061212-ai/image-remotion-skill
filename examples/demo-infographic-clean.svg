<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef5fb"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f80ed"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff7a59"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="890" cy="160" r="150" fill="#2dd4bf" opacity="0.08"/>
  <circle cx="160" cy="1680" r="190" fill="#2f80ed" opacity="0.07"/>

  <text x="86" y="138" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#2f80ed">AI-FACING TEMPLATE SKILL</text>
  <text x="86" y="224" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="900" fill="#10243d">From Image</text>
  <text x="86" y="304" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="900" fill="#10243d">To Motion Template</text>
  <text x="88" y="364" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#55708a">Coarse category, simple style, reliable Remotion output.</text>

  <g transform="translate(86 470)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#10243d">Template routing score</text>
    <line x1="0" y1="292" x2="900" y2="292" stroke="#cbd9e6" stroke-width="4"/>
    <line x1="0" y1="72" x2="0" y2="292" stroke="#cbd9e6" stroke-width="4"/>
    <rect x="62" y="164" width="76" height="128" rx="16" fill="#2f80ed"/>
    <rect x="214" y="112" width="76" height="180" rx="16" fill="#2dd4bf"/>
    <rect x="366" y="142" width="76" height="150" rx="16" fill="#ffd166"/>
    <rect x="518" y="82" width="76" height="210" rx="16" fill="#ff7a59"/>
    <rect x="670" y="124" width="76" height="168" rx="16" fill="#8b5cf6"/>
    <path d="M100 164 L252 112 L404 142 L556 82 L708 124" fill="none" stroke="#10243d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="100" cy="164" r="10" fill="#10243d"/>
    <circle cx="252" cy="112" r="10" fill="#10243d"/>
    <circle cx="404" cy="142" r="10" fill="#10243d"/>
    <circle cx="556" cy="82" r="10" fill="#10243d"/>
    <circle cx="708" cy="124" r="10" fill="#10243d"/>
    <text x="52" y="340" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#55708a">info</text>
    <text x="196" y="340" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#55708a">photo</text>
    <text x="352" y="340" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#55708a">shot</text>
    <text x="498" y="340" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#55708a">product</text>
    <text x="652" y="340" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#55708a">multi</text>
  </g>

  <g transform="translate(86 930)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#10243d">Minimal request shape</text>
    <g font-family="Helvetica, Arial, sans-serif">
      <circle cx="32" cy="86" r="26" fill="url(#blue)"/><text x="78" y="97" font-size="30" font-weight="800" fill="#10243d">imageCategory</text><text x="78" y="134" font-size="22" fill="#55708a">rough classification only</text>
      <circle cx="32" cy="206" r="26" fill="url(#warm)"/><text x="78" y="217" font-size="30" font-weight="800" fill="#10243d">effectStyle</text><text x="78" y="254" font-size="22" fill="#55708a">style hint, not editing instructions</text>
      <circle cx="32" cy="326" r="26" fill="#8b5cf6"/><text x="78" y="337" font-size="30" font-weight="800" fill="#10243d">assets + text</text><text x="78" y="374" font-size="22" fill="#55708a">paths, duration, aspect ratio, title</text>
    </g>
    <path d="M32 112 L32 180 M32 232 L32 300" stroke="#cbd9e6" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g transform="translate(86 1402)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#10243d">Pipeline</text>
    <g font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#10243d">
      <rect x="0" y="58" width="208" height="92" rx="24" fill="#dff3ff"/>
      <text x="104" y="114" text-anchor="middle">Request</text>
      <path d="M228 104 H308" stroke="#93a8ba" stroke-width="6" stroke-linecap="round"/>
      <path d="M294 84 L324 104 L294 124" fill="none" stroke="#93a8ba" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="344" y="58" width="208" height="92" rx="24" fill="#defaf3"/>
      <text x="448" y="114" text-anchor="middle">Template</text>
      <path d="M572 104 H652" stroke="#93a8ba" stroke-width="6" stroke-linecap="round"/>
      <path d="M638 84 L668 104 L638 124" fill="none" stroke="#93a8ba" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="688" y="58" width="208" height="92" rx="24" fill="#fff1d3"/>
      <text x="792" y="114" text-anchor="middle">Video</text>
    </g>
  </g>

  <text x="540" y="1818" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#55708a" text-anchor="middle">Clean infographic demo for camera-motion template testing</text>
</svg>
